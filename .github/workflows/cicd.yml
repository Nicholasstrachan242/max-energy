name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: test
      DATABASE_URL: 'mysql+pymysql://test_user:test_pass@127.0.0.1:3306/test_db'
      DB_USER: test_user
      DB_PASS: test_pass
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: test_db

    steps:
      - uses: actions/checkout@v4

      - name: Set email encryption key (FOR TESTING ONLY)
        run: echo "EMAIL_ENCRYPTION_KEY=dHuevh04hI1Pn0ITPXmkka_sn-o3-5R9hCNkG_XbAN4=" >> $GITHUB_ENV

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h "$DB_HOST" -P "$DB_PORT" -u"$DB_USER" -p"$DB_PASS" --silent; then
              echo "MySQL is ready."
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Reset test database
        run: |
          mysql -h "$DB_HOST" -P "$DB_PORT" -u"$DB_USER" -p"$DB_PASS" -e "DROP DATABASE IF EXISTS $DB_NAME; CREATE DATABASE $DB_NAME;"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run migrations
        run: flask db upgrade

      - name: Test with pytest
        run: pytest

  # TODO: uncomment deploy and continue testing

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            git config --global --add safe.directory /var/www/max-energy
            cd /var/www/max-energy
            git pull origin main
            source .venv/bin/activate
            pip install -r requirements.txt
            chmod +x /var/www/max-energy/.venv/bin/flask
            flask db upgrade
            sudo systemctl restart max-energy_gunicorn.service
