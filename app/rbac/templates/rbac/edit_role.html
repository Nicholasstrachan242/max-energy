{% extends "base.html" %}

{% block title %}Edit Role{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4>Edit Role: {{ role.name }}</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label">Role Name</label>
                            <input type="text" class="form-control" id="name" name="name" 
                                   value="{{ role.name }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3">{{ role.description or '' }}</textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Permissions</label>
                            <div class="border rounded p-3" style="max-height: 300px; overflow-y: auto;">
                                {% for permission in permissions %}
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" 
                                           name="permissions" value="{{ permission.id }}" 
                                           id="perm_{{ permission.id }}"
                                           {{ 'checked' if permission in role.permissions else '' }}>
                                    <label class="form-check-label" for="perm_{{ permission.id }}">
                                        <strong>{{ permission.name }}</strong>
                                        {% if permission.description %}
                                        <br><small class="text-muted">{{ permission.description }}</small>
                                        {% endif %}
                                    </label>
                                </div>
                                {% endfor %}
                            </div>
                            <small class="text-muted">Select the permissions that should be assigned to this role.</small>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('rbac.role_management') }}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Update Role</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
